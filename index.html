<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sandstorm</title>
  <link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
  <div id="starting">Starting…</div>
  <div id="rotate">Rotate to landscape</div>
  <div id="start">
    <h1>Sandstorm</h1>
    <button id="play" type="button">Play</button>
    <button id="quality" type="button" class="quality-btn">Quality</button>
    <script>/* A10: label from ?q / saved tier before first paint (was a 'High' flash); main.js relabels once loaded */(function(){try{var b=document.getElementById('quality'),m=/[?&]q=([a-z_-]+)/i.exec(location.search),v=m?m[1].toLowerCase().replace(/_/g,'-'):null;if(v==='ultralow'||v==='ultra'||v==='ul')v='ultra-low';if(v!=='ultra-low'&&v!=='low'&&v!=='high')v=null;if(!v){var l=localStorage.getItem('ss.quality');if(l==='ultra-low'||l==='low'||l==='high')v=l;}if(v)b.textContent='Quality: '+(v==='ultra-low'?'Ultra-low':v==='low'?'Low':'High');}catch(e){}})();</script>
    <p id="best">Best: 0</p>
    <p id="loading">Loading street…</p>
  </div>
  <div id="over">
    <h2>Killed in action</h2>
    <p id="over-new">NEW BEST</p>
    <div id="over-stats"></div>
    <table id="over-table"></table>
    <button id="restart" type="button">Restart</button>
  </div>
  <div id="hud"></div>
  <script type="module" src="dist/game.js"></script>
</body>
</html>
